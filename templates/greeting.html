<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Billboard</title>
  <style>
    :root {
      --red: #c8102e;
      --ink: #16181b;
      --muted: #5c636b;
      --rule: #ececec;
    }
    html, body {
      height: 100%;
    }
    body {
      background: #fff;
      color: var(--ink);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      cursor: none;
      overflow: hidden;
    }
    /* Red bands down both edges, like the flag. */
    body::before, body::after {
      content: "";
      position: fixed;
      top: 0;
      bottom: 0;
      width: 1.4vw;
      background: var(--red);
      z-index: 2;
    }
    body::before { left: 0; }
    body::after { right: 0; }
    header {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2.5vh 4vw;
      border-bottom: 0.5vh solid var(--red);
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
      transition: background 2s ease;
    }
    header > div {
      position: relative;
      z-index: 1;
    }

    /* ---- Live sky behind the greeting, driven by the current weather (like the iPhone Weather app). ---- */
    /* Every sky is kept dark enough that the white header text stays readable. */
    .day.clear { --sky-top: #1f6fc0; --sky-bottom: #4f9ee0; }
    .day.partly { --sky-top: #3a74b3; --sky-bottom: #6f9fcf; }
    .day.cloudy { --sky-top: #4f6174; --sky-bottom: #6b7b8b; }
    .day.fog { --sky-top: #5a6671; --sky-bottom: #737e88; }
    .day.rain { --sky-top: #34495c; --sky-bottom: #566b7e; }
    .day.snow { --sky-top: #526a84; --sky-bottom: #6d839a; }
    .day.storm { --sky-top: #232a35; --sky-bottom: #3d4756; }
    .night.clear { --sky-top: #07122b; --sky-bottom: #1b2f5c; }
    .night.partly { --sky-top: #0e1a33; --sky-bottom: #26385a; }
    .night.cloudy { --sky-top: #1a232f; --sky-bottom: #333e4c; }
    .night.fog { --sky-top: #252c34; --sky-bottom: #40484f; }
    .night.rain { --sky-top: #101823; --sky-bottom: #263443; }
    .night.snow { --sky-top: #1f2a3a; --sky-bottom: #3c4a60; }
    .night.storm { --sky-top: #0a0d12; --sky-bottom: #1f252e; }
    #sky {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    #sky > * {
      position: absolute;
    }
    .sun {
      right: 10vw;
      top: -14vh;
      width: 34vh;
      height: 34vh;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 238, 170, 0.85) 0%, rgba(255, 210, 90, 0.35) 35%, rgba(255, 200, 80, 0) 70%);
      animation: sun-pulse 7s ease-in-out infinite;
    }
    @keyframes sun-pulse {
      50% { transform: scale(1.12); opacity: 0.85; }
    }
    .moon {
      right: 30vw;
      top: 2.5vh;
      width: 5vh;
      height: 5vh;
      border-radius: 50%;
      background: #f3efe0;
      box-shadow: 0 0 3vh 1vh rgba(243, 239, 224, 0.35);
    }
    .star {
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
    }
    @keyframes twinkle {
      50% { opacity: 0.2; }
    }
    .cloud {
      width: 26vw;
      height: 12vh;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, var(--alpha)) 0%, rgba(255, 255, 255, 0) 68%);
      animation: drift var(--dur) linear infinite;
      animation-delay: var(--delay);
    }
    @keyframes drift {
      from { transform: translateX(-30vw); }
      to { transform: translateX(110vw); }
    }
    .fog-band {
      left: -20vw;
      width: 140vw;
      height: 6vh;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0));
      animation: fog-slide var(--dur) ease-in-out infinite alternate;
    }
    @keyframes fog-slide {
      from { transform: translateX(-10vw); }
      to { transform: translateX(10vw); }
    }
    .drop {
      top: 0;
      width: 2px;
      height: 3.5vh;
      background: linear-gradient(rgba(255, 255, 255, 0), rgba(220, 235, 255, 0.65));
      animation: fall var(--dur) linear infinite;
      animation-delay: var(--delay);
    }
    @keyframes fall {
      from { transform: translateY(-5vh) rotate(12deg); }
      to { transform: translateY(26vh) rotate(12deg); }
    }
    .flake {
      top: 0;
      width: 0.7vh;
      height: 0.7vh;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      animation: snow-fall var(--dur) linear infinite;
      animation-delay: var(--delay);
    }
    @keyframes snow-fall {
      0% { transform: translate(0, -3vh); }
      50% { transform: translate(1.5vw, 11vh); }
      100% { transform: translate(0, 26vh); }
    }
    #sky-preview {
      position: absolute;
      left: 50%;
      bottom: 1vh;
      transform: translateX(-50%);
      z-index: 2;
      font-size: 0.9vw;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 0.3vh 0.8vw;
      border-radius: 1vh;
      background: rgba(0, 0, 0, 0.45);
    }
    .flash {
      inset: 0;
      background: #fff;
      opacity: 0;
      animation: lightning 9s infinite;
    }
    @keyframes lightning {
      0%, 90%, 92%, 95%, 100% { opacity: 0; }
      91% { opacity: 0.55; }
      94% { opacity: 0.35; }
    }
    .greeting-line {
      display: flex;
      align-items: center;
      gap: 1.2vw;
    }
    .leaf-icon {
      width: 3.6vw;
      height: 3.6vw;
      flex: none;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.3));
    }
    #greeting {
      font-size: 3.8vw;
      font-weight: 300;
      margin: 0;
    }
    #clock {
      font-size: 1.5vw;
      color: rgba(255, 255, 255, 0.92);
      margin-top: 0.6vh;
      margin-left: 4.8vw;
    }
    #weather {
      display: flex;
      align-items: center;
      gap: 1.5vw;
    }
    #weather .icon {
      font-size: 4.5vw;
    }
    #weather .temp {
      font-size: 3.2vw;
      font-weight: 600;
      line-height: 1;
    }
    #weather .desc {
      font-size: 1.3vw;
      margin-top: 0.5vh;
    }
    #weather .meta {
      font-size: 1vw;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 0.3vh;
    }
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
      padding: 2.5vh 4vw 2vh;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    /* Faint maple leaf behind the headlines; kept very light so dark text stays crisp. */
    #maple {
      position: absolute;
      right: 3vw;
      top: 50%;
      transform: translateY(-50%);
      width: 62vh;
      height: 62vh;
      opacity: 0.06;
      pointer-events: none;
    }
    .section-head, #news {
      position: relative;
      z-index: 1;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2vh;
    }
    .section-title {
      font-size: 1.3vw;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--red);
      transition: opacity 0.8s ease;
    }
    /* Darker shades so each category heading reads clearly on white. */
    .section-title.top { color: var(--red); }
    .section-title.politics { color: #1d4ed8; }
    .section-title.business { color: #b45309; }
    .section-title.health { color: #047857; }
    .section-title.technology { color: #6d28d9; }
    .section-title.fading {
      opacity: 0;
    }
    #page-dots {
      display: flex;
      gap: 0.6vw;
    }
    #page-dots span {
      width: 0.6vw;
      height: 0.6vw;
      border-radius: 50%;
      background: #d9d9d9;
      transition: background 0.8s ease;
    }
    #page-dots span.active {
      background: var(--red);
    }
    #news {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: opacity 0.8s ease;
    }
    #news.fading {
      opacity: 0;
    }
    .story {
      /* Row height is set by paginate() so a full screen of rows fills the space exactly. */
      flex: 0 0 var(--row-height, auto);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 1.5vw;
      border-top: 1px solid var(--rule);
      padding: 1.4vh 0;
    }
    #news.measuring .story {
      flex: none;
    }
    .story .body {
      flex: 1;
      min-width: 0;
    }
    .story .title {
      font-size: 2.4vw;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .story .meta {
      font-size: 1.1vw;
      color: var(--muted);
      margin-top: 0.5vh;
    }
    /* ---- Daily plan screen ---- */
    /* Scenic backdrop shown only on the plan screen: sunrise over mountains and a lake. */
    #calm {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
      overflow: hidden;
    }
    #calm svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .scene-cloud {
      animation: scene-drift 140s linear infinite;
    }
    @keyframes scene-drift {
      from { transform: translateX(-400px); }
      to { transform: translateX(2000px); }
    }
    .shimmer {
      animation: shimmer 6s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.15; transform: translateX(0); }
      50% { opacity: 0.55; transform: translateX(25px); }
    }
    .sun-glow {
      animation: sun-glow 10s ease-in-out infinite;
      transform-origin: 1180px 430px;
    }
    @keyframes sun-glow {
      40% { transform: scale(1.12); }
    }
    main.plan-mode #calm {
      opacity: 1;
    }
    #maple {
      transition: opacity 1.2s ease;
    }
    main.plan-mode #maple {
      opacity: 0;
    }
    main.plan-mode .plan-grid {
      gap: 2.6vh 2.2vw;
    }
    main.plan-mode .step ul {
      font-size: 1.12vw;
      line-height: 1.45;
    }
    /* Frosted cards: enough white that dark text stays crisp, enough see-through to show the scene. */
    main.plan-mode .step {
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0.6vh 2vh rgba(0, 0, 0, 0.15);
    }
    main.plan-mode .section-title {
      flex: none;
      background: rgba(255, 255, 255, 0.9);
      padding: 0.5vh 1vw;
      border-radius: 0.6vw;
    }
    /* Checklist, breathing guide and note sit on one white panel so they stay readable over the scene. */
    .plan-panel {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 0.8vw;
      padding: 1.2vh 1.3vw;
      display: flex;
      flex-direction: column;
      gap: 1vh;
      box-shadow: 0 0.6vh 2vh rgba(0, 0, 0, 0.15);
    }
    main.plan-mode .plan-note {
      color: #3f4650;
    }
    .section-title.plan { color: var(--red); }
    .plan {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 1.6vh;
      padding-top: 1vh;
    }
    .plan-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 1fr 1fr;
      gap: 1.4vw;
    }
    .step {
      background: #fff;
      border: 1px solid var(--rule);
      border-top: 0.5vh solid var(--red);
      border-radius: 0.8vw;
      padding: 1.6vh 1.3vw;
      box-shadow: 0 0.3vh 1.2vh rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }
    .step-head {
      display: flex;
      align-items: center;
      gap: 0.8vw;
      font-size: 1.45vw;
      font-weight: 700;
      margin-bottom: 1vh;
    }
    .step-num {
      flex: none;
      width: 2.3vw;
      height: 2.3vw;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      font-size: 1.15vw;
      display: grid;
      place-items: center;
    }
    .step ul {
      margin: 0;
      padding-left: 1.3vw;
      font-size: 1.2vw;
      line-height: 1.5;
    }
    .step strong {
      color: var(--red);
    }
    .plan-strip {
      display: flex;
      align-items: center;
      gap: 2vw;
    }
    /* Breathing guide: grows for 4 s (inhale), shrinks for 6 s (exhale). */
    .pacer {
      flex: none;
      display: flex;
      align-items: center;
      gap: 1vw;
    }
    .pacer-ball {
      width: 8vh;
      height: 8vh;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f6b5bf, var(--red));
      animation: breathe 10s ease-in-out infinite;
    }
    @keyframes breathe {
      0% { transform: scale(0.5); }
      40% { transform: scale(1); }
      100% { transform: scale(0.5); }
    }
    .pacer-label {
      display: grid;
      font-size: 1.3vw;
      font-weight: 700;
      color: var(--red);
      width: 11vw;
    }
    .pacer-label span {
      grid-area: 1 / 1;
    }
    .pacer-in { animation: show-inhale 10s step-end infinite; }
    .pacer-out { animation: show-exhale 10s step-end infinite; }
    @keyframes show-inhale {
      0% { opacity: 1; }
      40% { opacity: 0; }
    }
    @keyframes show-exhale {
      0% { opacity: 0; }
      40% { opacity: 1; }
    }
    .checklist {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1vw;
    }
    .check {
      border-left: 0.3vw solid var(--red);
      padding: 0.6vh 0.8vw;
      background: #fbf1f2;
      border-radius: 0 0.5vw 0.5vw 0;
    }
    .check b {
      display: block;
      font-size: 1.1vw;
    }
    .check span {
      font-size: 1vw;
      color: var(--muted);
    }
    .plan-note {
      font-size: 1.1vw;
      color: var(--muted);
      font-style: italic;
    }
    /* ---- Market screens: dark trading-terminal backdrop ---- */
    #market-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
      background:
        linear-gradient(rgba(127, 209, 255, 0.05) 1px, transparent 1px) 0 0 / 100% 6vh,
        linear-gradient(90deg, rgba(127, 209, 255, 0.05) 1px, transparent 1px) 0 0 / 6vh 100%,
        radial-gradient(ellipse at 75% 20%, #16305a 0%, #0b1730 55%, #070e1f 100%);
    }
    #market-bg svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .chart-line {
      fill: none;
      stroke-width: 3;
      stroke-linejoin: round;
      stroke-dasharray: 2600;
      animation: chart-trace 24s linear infinite;
    }
    @keyframes chart-trace {
      from { stroke-dashoffset: 2600; }
      to { stroke-dashoffset: -2600; }
    }
    main.market-mode #market-bg { opacity: 1; }
    main.market-mode #maple { opacity: 0; }
    main.market-mode .section-title { color: #7fd1ff; }
    main.market-mode #page-dots span { background: rgba(255, 255, 255, 0.25); }
    main.market-mode #page-dots span.active { background: #7fd1ff; }
    .up { color: #2ee59d; }
    .down { color: #ff6b7d; }
    .market {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 2vh;
      color: #eef3fb;
      padding-top: 0.5vh;
    }
    .index-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr) auto;
      gap: 1.2vw;
      align-items: stretch;
    }
    .index-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.8vw;
      padding: 1.2vh 1.2vw;
    }
    .index-card .name {
      font-size: 1.05vw;
      color: #a9b8cf;
      letter-spacing: 0.05em;
    }
    .index-card .value {
      font-size: 2vw;
      font-weight: 700;
      margin-top: 0.3vh;
    }
    .index-card .chg {
      font-size: 1.25vw;
      font-weight: 600;
    }
    .market-status {
      align-self: center;
      font-size: 1vw;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 0.8vh 1vw;
      border-radius: 2vh;
      border: 1px solid currentColor;
      white-space: nowrap;
    }
    .heatmap {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 1vw;
    }
    .tile {
      border-radius: 0.8vw;
      padding: 1.4vh 1.2vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
    .tile .name {
      font-size: 1.4vw;
      font-weight: 700;
    }
    .tile .etf {
      font-size: 0.95vw;
      opacity: 0.85;
    }
    .tile .chg {
      font-size: 2.6vw;
      font-weight: 700;
    }
    .tile.legend {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      color: #a9b8cf;
      font-size: 1vw;
      text-shadow: none;
      justify-content: center;
      gap: 1vh;
    }
    .sector-cols {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.2vw;
    }
    .sector-col {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 0.6vh solid var(--accent);
      border-radius: 0.8vw;
      padding: 1.6vh 1.2vw;
      display: flex;
      flex-direction: column;
    }
    .sector-col .head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.6vw;
      padding-bottom: 1.2vh;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .sector-col .head .name {
      font-size: 1.45vw;
      font-weight: 700;
    }
    .sector-col .head .chg {
      font-size: 1.45vw;
      font-weight: 700;
      white-space: nowrap;
    }
    .sector-col .etf {
      font-size: 0.9vw;
      color: #a9b8cf;
      margin-top: 0.4vh;
    }
    .stock {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stock:last-child {
      border-bottom: 0;
    }
    .stock .sym {
      font-size: 1.45vw;
      font-weight: 700;
    }
    .stock .co {
      font-size: 0.95vw;
      color: #a9b8cf;
    }
    .stock .right {
      text-align: right;
    }
    .stock .px {
      font-size: 1.25vw;
    }
    .stock .chg {
      font-size: 1.2vw;
      font-weight: 700;
    }
    #news-status {
      font-size: 1.3vw;
      color: var(--muted);
    }
  </style>
</head>
<body data-name="{{ name }}">
  <svg style="display: none" aria-hidden="true">
    <symbol id="leaf" viewBox="-2100 -2100 4200 4200">
      <path d="m-90 2030 45-863a95 95 0 0 0-111-98l-859 151 116-320a65 65 0 0 0-20-73l-941-762 212-99a65 65 0 0 0 34-79l-186-572 542 115a65 65 0 0 0 73-38l105-247 423 454a65 65 0 0 0 111-57l-204-1052 327 189a65 65 0 0 0 91-27l332-652 332 652a65 65 0 0 0 91 27l327-189-204 1052a65 65 0 0 0 111 57l423-454 105 247a65 65 0 0 0 73 38l542-115-186 572a65 65 0 0 0 34 79l212 99-941 762a65 65 0 0 0-20 73l116 320-859-151a95 95 0 0 0-111 98l45 863z"/>
    </symbol>
  </svg>
  <header id="header" class="day cloudy">
    <div id="sky" aria-hidden="true"></div>
    <div>
      <div class="greeting-line">
        <svg class="leaf-icon" fill="#fff"><use href="#leaf"/></svg>
        <h1 id="greeting"></h1>
      </div>
      <div id="clock"></div>
    </div>
    <div id="weather"><div class="meta">Loading weather…</div></div>
  </header>

  <main>
    <div id="market-bg" aria-hidden="true">
      <svg viewBox="0 0 1600 700" preserveAspectRatio="none">
        <defs>
          <linearGradient id="chart-fade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2ee59d" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#2ee59d" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#7fd1ff" stop-opacity="0.15"/>
          </linearGradient>
        </defs>
        <path id="chart-a" class="chart-line" stroke="url(#chart-fade)"/>
        <path id="chart-b" class="chart-line" stroke="rgba(127, 209, 255, 0.12)" style="animation-delay: -12s"/>
      </svg>
    </div>
    <div id="calm" aria-hidden="true">
      <svg viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="scene-sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6fafdc"/>
            <stop offset="0.55" stop-color="#cbe3f1"/>
            <stop offset="1" stop-color="#fde2c2"/>
          </linearGradient>
          <linearGradient id="scene-lake" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8fbcd4"/>
            <stop offset="1" stop-color="#3f7596"/>
          </linearGradient>
          <radialGradient id="scene-sun">
            <stop offset="0" stop-color="#fff7de" stop-opacity="1"/>
            <stop offset="0.25" stop-color="#ffe2a8" stop-opacity="0.8"/>
            <stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="1600" height="470" fill="url(#scene-sky)"/>
        <circle class="sun-glow" cx="1180" cy="430" r="230" fill="url(#scene-sun)"/>
        <circle cx="1180" cy="430" r="48" fill="#fff4d6"/>
        <g fill="#fff" opacity="0.85">
          <g class="scene-cloud" style="animation-delay: -20s"><ellipse cx="200" cy="90" rx="110" ry="26"/><ellipse cx="260" cy="72" rx="70" ry="30"/></g>
          <g class="scene-cloud" style="animation-delay: -75s"><ellipse cx="300" cy="160" rx="90" ry="20"/><ellipse cx="340" cy="146" rx="55" ry="24"/></g>
          <g class="scene-cloud" style="animation-delay: -115s"><ellipse cx="150" cy="60" rx="80" ry="18"/></g>
        </g>
        <g id="scene-land">
          <path fill="#a9c1d6" d="M0 400 L120 330 L230 380 L360 300 L480 370 L600 320 L720 380 L860 290 L1000 360 L1120 310 L1260 370 L1400 300 L1520 350 L1600 330 L1600 470 L0 470Z"/>
          <path fill="#6d8cab" d="M0 470 L0 420 L180 260 L300 360 L420 240 L560 380 L700 230 L860 400 L980 300 L1100 420 L1250 250 L1400 390 L1520 320 L1600 360 L1600 470Z"/>
          <g fill="#f4f8fb">
            <path d="M150 287 L180 260 L212 288 L196 284 L182 296 L166 285Z"/>
            <path d="M386 272 L420 240 L452 274 L436 268 L421 282 L404 270Z"/>
            <path d="M664 264 L700 230 L736 270 L718 264 L702 278 L684 266Z"/>
            <path d="M952 326 L980 300 L1006 330 L992 325 L980 335 L966 326Z"/>
            <path d="M1216 282 L1250 250 L1284 286 L1267 280 L1251 293 L1234 282Z"/>
          </g>
          <path fill="#2f5a4a" d="M0 470 Q200 432 400 452 T800 448 T1200 454 T1600 444 L1600 472 L0 472Z"/>
          <g id="scene-trees" fill="#1f4337"></g>
        </g>
        <rect y="470" width="1600" height="230" fill="url(#scene-lake)"/>
        <use href="#scene-land" transform="translate(0 940) scale(1 -1)" opacity="0.22"/>
        <g fill="#fff">
          <rect class="shimmer" x="1080" y="500" width="200" height="3" rx="1.5"/>
          <rect class="shimmer" x="1120" y="530" width="130" height="3" rx="1.5" style="animation-delay: -2s"/>
          <rect class="shimmer" x="1050" y="565" width="240" height="3" rx="1.5" style="animation-delay: -4s"/>
          <rect class="shimmer" x="300" y="600" width="160" height="2" rx="1" style="animation-delay: -3s"/>
          <rect class="shimmer" x="700" y="640" width="200" height="2" rx="1" style="animation-delay: -1s"/>
        </g>
      </svg>
    </div>
    <svg id="maple" fill="#c8102e" aria-hidden="true"><use href="#leaf"/></svg>
    <div class="section-head">
      <div class="section-title" id="section-title">News</div>
      <div id="page-dots"></div>
    </div>
    <div id="news"><div id="news-status">Loading news…</div></div>
  </main>

  <script>
    const NAME = document.body.dataset.name;
    const WEATHER_REFRESH_MS = 60000;
    // The server only calls the news API every 15 min; this just picks up its cached result.
    const NEWS_REFRESH_MS = 5 * 60000;
    const PAGE_MS = 8000;
    // The daily plan has more to read, so it stays up longer.
    const PLAN_PAGE_MS = 8000;
    const PLAN_REFRESH_MS = 30 * 60000;
    // The server refreshes prices every 5 min while the market is open.
    const MARKET_REFRESH_MS = 2 * 60000;
    const MARKET_OVERVIEW_MS = 10000;
    const SECTORS_PER_SCREEN = 4;
    const FADE_MS = 800;
    // Long headlines shrink the screen's titles down to this fraction of normal size before being cut off.
    const MIN_TITLE_SCALE = 0.8;

    const newsEl = document.getElementById("news");
    const titleEl = document.getElementById("section-title");
    let categories = [];
    let plan = null;
    let market = null;
    // Each page is one screen: { category, articles }.
    let pages = [];
    let pageIndex = 0;

    function greetingFor(hour) {
      if (hour < 12) return "Good Morning";
      if (hour < 17) return "Good Afternoon";
      return "Good Evening";
    }

    function timeAgo(iso) {
      const minutes = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.round(minutes / 60);
      return hours < 24 ? `${hours}h ago` : `${Math.round(hours / 24)}d ago`;
    }

    function tick() {
      const now = new Date();
      document.getElementById("greeting").textContent = `${greetingFor(now.getHours())}, ${NAME}`;
      document.getElementById("clock").textContent =
        now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }) +
        " · " + now.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    }

    // Preview any sky without waiting for the weather: /?sky=rain-night, /?sky=clear-day, ...
    const SKY_OVERRIDE = new URLSearchParams(location.search).get("sky");
    let currentSky = "";

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function addParticles(sky, count, className, place) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement("div");
        el.className = className;
        place(el.style, i);
        sky.append(el);
      }
    }

    function setSky(condition, isDay) {
      const key = `${condition}-${isDay ? "day" : "night"}`;
      if (key === currentSky) return;
      currentSky = key;
      document.getElementById("header").className = `${isDay ? "day" : "night"} ${condition}`;

      const sky = document.getElementById("sky");
      sky.replaceChildren();
      const add = (className) => {
        const el = document.createElement("div");
        el.className = className;
        sky.append(el);
      };

      if (condition === "clear" || condition === "partly") {
        if (isDay) {
          add("sun");
        } else {
          add("moon");
          addParticles(sky, 45, "star", (st) => {
            st.left = `${rand(0, 100)}%`;
            st.top = `${rand(0, 95)}%`;
            st.setProperty("--dur", `${rand(2, 5)}s`);
            st.setProperty("--delay", `${-rand(0, 5)}s`);
          });
        }
      }
      const clouds = { partly: [3, 0.55], cloudy: [6, 0.4], rain: [5, 0.25], snow: [4, 0.35], storm: [5, 0.18], fog: [2, 0.3] };
      if (clouds[condition]) {
        const [count, alpha] = clouds[condition];
        addParticles(sky, count, "cloud", (st, i) => {
          st.top = `${rand(-4, 9)}vh`;
          st.setProperty("--alpha", isDay ? alpha : alpha * 0.5);
          // Negative delays spread the clouds across the sky from the first frame.
          const dur = rand(70, 120);
          st.setProperty("--dur", `${dur}s`);
          st.setProperty("--delay", `${-dur * (i / count)}s`);
        });
      }
      if (condition === "fog") {
        addParticles(sky, 4, "fog-band", (st, i) => {
          st.top = `${3 + i * 5}vh`;
          st.setProperty("--dur", `${rand(12, 20)}s`);
        });
      }
      if (condition === "rain" || condition === "storm") {
        addParticles(sky, condition === "storm" ? 90 : 60, "drop", (st) => {
          st.left = `${rand(-5, 100)}%`;
          st.setProperty("--dur", `${rand(0.55, 0.9)}s`);
          st.setProperty("--delay", `${-rand(0, 1)}s`);
        });
      }
      if (condition === "storm") add("flash");
      if (condition === "snow") {
        addParticles(sky, 50, "flake", (st) => {
          st.left = `${rand(0, 100)}%`;
          st.setProperty("--dur", `${rand(6, 11)}s`);
          st.setProperty("--delay", `${-rand(0, 11)}s`);
        });
      }
    }

    async function refreshWeather() {
      try {
        const res = await fetch("/api/weather");
        const { weather: w } = await res.json();
        if (!w) return;
        if (SKY_OVERRIDE) {
          const [condition, time] = SKY_OVERRIDE.split("-");
          setSky(condition, time !== "night");
          // Label it so a preview isn't mistaken for the real weather.
          if (!document.getElementById("sky-preview")) {
            const badge = document.createElement("div");
            badge.id = "sky-preview";
            badge.textContent = `PREVIEW: ${SKY_OVERRIDE.toUpperCase()} (not live weather)`;
            document.getElementById("header").append(badge);
          }
        } else {
          setSky(w.condition, w.is_day);
        }
        document.getElementById("weather").innerHTML = `
          <span class="icon">${w.icon}</span>
          <span class="details">
            <div class="temp">${Math.round(w.temperature)}°C</div>
            <div class="desc">${w.description}</div>
            <div class="meta">Feels ${Math.round(w.feels_like)}° · H ${Math.round(w.high)}° / L ${Math.round(w.low)}°</div>
            <div class="meta">${w.location}</div>
          </span>`;
      } catch (err) {
        // Keep showing the last known weather until the server is reachable again.
      }
    }

    // Headlines come from a third party, so build with textContent rather than innerHTML.
    function makeStory(a) {
      const story = document.createElement("div");
      story.className = "story";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = a.title;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${a.source} · ${timeAgo(a.published_at)}`;
      const body = document.createElement("div");
      body.className = "body";
      body.append(title, meta);
      story.append(body);
      return story;
    }

    // Shrink every title on the screen together until the longest fits, so rows stay one size.
    function fitTitles() {
      const titles = [...newsEl.querySelectorAll(".title")];
      if (!titles.length) return;
      const base = parseFloat(getComputedStyle(titles[0]).fontSize);
      let size = base;
      while (titles.some((t) => t.scrollWidth > t.clientWidth) && size > base * MIN_TITLE_SCALE) {
        size -= 1;
        titles.forEach((t) => (t.style.fontSize = `${size}px`));
      }
    }

    // Renders "**bold**" segments from the plan file as <strong>.
    function richText(el, text) {
      text.split(/\*\*(.+?)\*\*/).forEach((part, i) => {
        if (!part) return;
        if (i % 2) {
          const strong = document.createElement("strong");
          strong.textContent = part;
          el.append(strong);
        } else {
          el.append(part);
        }
      });
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function makePlan(p) {
      const grid = el("div", "plan-grid");
      p.steps.forEach((step, i) => {
        const card = el("div", "step");
        const head = el("div", "step-head");
        head.append(el("span", "step-num", String(i + 1)), el("span", "", step.title));
        const list = el("ul");
        for (const bullet of step.bullets) {
          const li = el("li");
          richText(li, bullet);
          list.append(li);
        }
        card.append(head, list);
        grid.append(card);
      });

      const pacer = el("div", "pacer");
      const label = el("div", "pacer-label");
      label.append(el("span", "pacer-in", "Inhale · 4s"), el("span", "pacer-out", "Exhale · 6s"));
      pacer.append(el("div", "pacer-ball"), label);

      const checklist = el("div", "checklist");
      for (const [activity, duration] of p.checklist) {
        const item = el("div", "check");
        item.append(el("b", "", activity), el("span", "", duration));
        checklist.append(item);
      }

      const strip = el("div", "plan-strip");
      strip.append(pacer, checklist);
      const panel = el("div", "plan-panel");
      panel.append(strip);
      if (p.important) panel.append(el("div", "plan-note", p.important));
      const wrap = el("div", "plan");
      wrap.append(grid, panel);
      return wrap;
    }

    function fmtPrice(value) {
      return value == null ? "–" : value.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtChange(pct) {
      if (pct == null) return "–";
      return `${pct >= 0 ? "▲" : "▼"} ${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%`;
    }

    function trend(pct) {
      return pct == null ? "" : pct >= 0 ? "up" : "down";
    }

    // Heatmap colour: slate when flat, deepening to green/red as the move approaches ±3%.
    function heatColor(pct) {
      const base = [42, 52, 70];
      const full = pct >= 0 ? [13, 133, 88] : [178, 34, 52];
      const t = Math.min(Math.abs(pct || 0) / 3, 1);
      const mix = base.map((b, i) => Math.round(b + (full[i] - b) * t));
      return `rgb(${mix.join(",")})`;
    }

    function makeIndexRow(m) {
      const row = el("div", "index-row");
      for (const idx of m.indexes) {
        const card = el("div", "index-card");
        card.append(
          el("div", "name", idx.name),
          el("div", "value", fmtPrice(idx.price)),
          el("div", `chg ${trend(idx.change_pct)}`, fmtChange(idx.change_pct)),
        );
        row.append(card);
      }
      row.append(el("div", `market-status ${m.market_open ? "up" : "down"}`, m.market_open ? "● MARKET OPEN" : "● MARKET CLOSED"));
      return row;
    }

    function makeMarketOverview(m) {
      const heatmap = el("div", "heatmap");
      for (const sector of m.sectors) {
        const tile = el("div", "tile");
        tile.style.background = heatColor(sector.change_pct);
        const top = el("div");
        top.append(el("div", "name", sector.name), el("div", "etf", sector.symbol));
        tile.append(top, el("div", "chg", fmtChange(sector.change_pct)));
        heatmap.append(tile);
      }
      const legend = el("div", "tile legend");
      const updated = new Date(m.updated_at * 1000).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      legend.append(el("div", "", "Change vs previous close"), el("div", "", `Updated ${updated}`));
      heatmap.append(legend);
      const wrap = el("div", "market");
      wrap.append(makeIndexRow(m), heatmap);
      return wrap;
    }

    function makeSectorColumns(sectors) {
      const cols = el("div", "sector-cols");
      for (const sector of sectors) {
        const col = el("div", "sector-col");
        col.style.setProperty("--accent", sector.change_pct >= 0 ? "#2ee59d" : "#ff6b7d");
        const head = el("div", "head");
        const left = el("div");
        left.append(el("div", "name", sector.name), el("div", "etf", `${sector.symbol} · ${fmtPrice(sector.price)}`));
        head.append(left, el("div", `chg ${trend(sector.change_pct)}`, fmtChange(sector.change_pct)));
        col.append(head);
        for (const stock of sector.stocks) {
          const row = el("div", "stock");
          const info = el("div");
          info.append(el("div", "sym", stock.symbol), el("div", "co", stock.name));
          const right = el("div", "right");
          right.append(el("div", "px", fmtPrice(stock.price)), el("div", `chg ${trend(stock.change_pct)}`, fmtChange(stock.change_pct)));
          row.append(info, right);
          col.append(row);
        }
        cols.append(col);
      }
      const wrap = el("div", "market");
      wrap.append(cols);
      return wrap;
    }

    function paginate() {
      pages = [];
      if (plan) pages.push({ plan });
      if (categories.length) {
        newsEl.classList.add("measuring");
        newsEl.replaceChildren(makeStory(categories[0].articles[0]));
        const perScreen = Math.max(1, Math.floor(newsEl.clientHeight / newsEl.firstChild.offsetHeight));
        newsEl.classList.remove("measuring");
        newsEl.style.setProperty("--row-height", `${newsEl.clientHeight / perScreen}px`);
        for (const category of categories) {
          const { articles } = category;
          // A category that doesn't fit on one screen is spread evenly (e.g. 5 + 5 rather than 7 + 3).
          const pageCount = Math.ceil(articles.length / perScreen);
          const perPage = Math.ceil(articles.length / pageCount);
          for (let i = 0; i < articles.length; i += perPage) {
            pages.push({ category, articles: articles.slice(i, i + perPage) });
          }
        }
      }
      if (market) {
        pages.push({ marketOverview: market });
        for (let i = 0; i < market.sectors.length; i += SECTORS_PER_SCREEN) {
          pages.push({ marketSectors: market.sectors.slice(i, i + SECTORS_PER_SCREEN) });
        }
      }
      pageIndex = Math.max(0, Math.min(pageIndex, pages.length - 1));
    }

    function showPage() {
      const page = pages[pageIndex];
      applyBackdrop(page);
      if (page.marketOverview) {
        titleEl.textContent = "Markets";
        titleEl.className = "section-title";
        newsEl.replaceChildren(makeMarketOverview(page.marketOverview));
      } else if (page.marketSectors) {
        titleEl.textContent = "Sector Leaders";
        titleEl.className = "section-title";
        newsEl.replaceChildren(makeSectorColumns(page.marketSectors));
      } else if (page.plan) {
        titleEl.textContent = "Daily Plan";
        titleEl.className = "section-title plan";
        newsEl.replaceChildren(makePlan(page.plan));
      } else {
        titleEl.textContent = page.category.label;
        titleEl.className = `section-title ${page.category.key}`;
        newsEl.replaceChildren(...page.articles.map(makeStory));
        fitTitles();
      }
      document.getElementById("page-dots").replaceChildren(...(pages.length > 1 ? pages : []).map((_, i) => {
        const dot = document.createElement("span");
        dot.classList.toggle("active", i === pageIndex);
        return dot;
      }));
      scheduleNext();
    }

    function render(error) {
      paginate();
      if (!pages.length) {
        const status = document.createElement("div");
        status.id = "news-status";
        status.textContent = error || "Waiting for headlines…";
        newsEl.replaceChildren(status);
        titleEl.textContent = "News";
        titleEl.className = "section-title";
        document.getElementById("page-dots").replaceChildren();
        return;
      }
      showPage();
    }

    // Each screen starts its own timer when shown, so its duration always matches what's on screen.
    let pageTimer = null;
    function scheduleNext() {
      clearTimeout(pageTimer);
      if (pages.length < 2) return;
      const page = pages[pageIndex];
      const duration = page.plan ? PLAN_PAGE_MS : page.marketOverview ? MARKET_OVERVIEW_MS : PAGE_MS;
      pageTimer = setTimeout(nextPage, duration);
    }

    // Switches the area's backdrop (plain, scenic plan, or market) for the given page.
    function applyBackdrop(page) {
      const main = document.querySelector("main");
      main.classList.toggle("plan-mode", !!page.plan);
      main.classList.toggle("market-mode", !!(page.marketOverview || page.marketSectors));
    }

    function nextPage() {
      // Start the backdrop change while the old screen fades out, so new text never lands on the wrong background.
      applyBackdrop(pages[(pageIndex + 1) % pages.length]);
      newsEl.classList.add("fading");
      titleEl.classList.add("fading");
      setTimeout(() => {
        pageIndex = (pageIndex + 1) % pages.length;
        showPage();
        newsEl.classList.remove("fading");
      }, FADE_MS);
    }

    async function refreshMarket() {
      try {
        const res = await fetch("/api/market");
        const data = await res.json();
        if (!data.market || JSON.stringify(data.market) === JSON.stringify(market)) return;
        market = data.market;
        render();
      } catch (err) {
        // Keep showing the last prices until the server is reachable again.
      }
    }

    async function refreshPlan() {
      try {
        const res = await fetch("/api/plan");
        const data = await res.json();
        if (JSON.stringify(data.plan) === JSON.stringify(plan)) return;
        plan = data.plan;
        render();
      } catch (err) {
        // Keep showing the last plan until the server is reachable again.
      }
    }

    async function refreshNews() {
      try {
        const res = await fetch("/api/news");
        const data = await res.json();
        if (JSON.stringify(data.categories) === JSON.stringify(categories) && categories.length) return;
        categories = data.categories;
        render(data.error);
      } catch (err) {
        // Keep showing the last headlines until the server is reachable again.
      }
    }

    // Random-walk price lines that trace across the market screens' backdrop.
    (function drawCharts() {
      for (const [id, start] of [["chart-a", 520], ["chart-b", 380]]) {
        let y = start;
        let d = `M0 ${y}`;
        for (let x = 40; x <= 1600; x += 40) {
          y = Math.max(80, Math.min(640, y + (Math.random() - 0.55) * 70));
          d += ` L${x} ${y.toFixed(0)}`;
        }
        document.getElementById(id).setAttribute("d", d);
      }
    })();

    // Pine treeline along the lake shore for the plan screen's scenery.
    (function plantTrees() {
      const trees = document.getElementById("scene-trees");
      let points = "";
      for (let x = -10; x < 1610; x += 14 + Math.random() * 16) {
        const h = 35 + Math.random() * 55;
        const w = h * 0.38;
        const base = 470 - Math.random() * 6;
        points += `<polygon points="${x},${base} ${x + w / 2},${base - h} ${x + w},${base}"/>`;
      }
      trees.innerHTML = points;
    })();

    tick();
    setInterval(tick, 1000);
    refreshWeather();
    setInterval(refreshWeather, WEATHER_REFRESH_MS);
    refreshNews();
    setInterval(refreshNews, NEWS_REFRESH_MS);
    refreshPlan();
    setInterval(refreshPlan, PLAN_REFRESH_MS);
    refreshMarket();
    setInterval(refreshMarket, MARKET_REFRESH_MS);
    // Re-split whenever the news area changes size (window resize, or the header growing once weather loads).
    let lastHeight = 0;
    new ResizeObserver(() => {
      if (newsEl.clientHeight === lastHeight || !pages.length) return;
      lastHeight = newsEl.clientHeight;
      render();
    }).observe(newsEl);
  </script>
</body>
